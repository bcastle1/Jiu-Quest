<!doctype html>
<!--
  Preview page for tools/video_motion/render_preview.mjs. It is served from the
  repository root by that script's local server, so "three" resolves to the
  repository's own node_modules/three and the page can import the site's
  src/animation/pairedMaterials.js unchanged. The script drives the page through
  window.jqPreview (see viewer.js); opening the page alone renders nothing.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Paired GLB preview</title>
  <style>
    html, body { margin: 0; padding: 0; background: #000; overflow: hidden; }
    canvas { display: block; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "/node_modules/three/build/three.module.js",
        "three/addons/": "/node_modules/three/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <script type="module" src="./viewer.js"></script>
</body>
</html>
