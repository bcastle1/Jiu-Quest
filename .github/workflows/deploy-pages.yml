name: Deploy JiuQuest to GitHub Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore the verified Unity player
        run: pnpm release:restore

      - name: Verify combat, persistence and release safety
        run: pnpm test

      - name: Build release candidate
        run: pnpm release:build

      - name: Install isolated browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify real Unity player and mobile layouts
        run: pnpm test:browser

      - name: Record exact release
        run: node -e "const fs=require('node:fs');const u=JSON.parse(fs.readFileSync('releases/unity/release.json'));fs.writeFileSync('dist/release.json',JSON.stringify({commit:process.env.GITHUB_SHA,runId:process.env.GITHUB_RUN_ID,repository:process.env.GITHUB_REPOSITORY,combatEngine:'unity',unityArchiveSha256:u.sha256,unitySourceFingerprint:u.sourceFingerprint}))"

      - name: Save reviewable website artifact
        uses: actions/upload-artifact@v4
        with:
          name: jiuquest-release-candidate-${{ github.sha }}
          path: dist
          retention-days: 14

      - name: Save browser verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jiuquest-browser-verification-${{ github.sha }}
          path: tmp/browser
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
