name: Validate Unreal pilot offline

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/unreal-pilot.yml"
      - "src/unreal/**"
      - "src/unity/bridge.js"
      - "tests/unrealBridge.test.js"
      - "tests/unrealLocalTransport.test.js"
      - "tests/unrealLocalSession.test.js"
      - "src/components/UnrealGrapplingStage*"
      - "src/components/GrapplingStage.jsx"
      - "vite.config.js"
      - "tools/prepare_unreal_pilot*.mjs"
      - "tools/unreal_pilot.ps1"
      - "tools/unreal_local_app.ps1"
      - "tools/unreal_embed.*"
      - "tools/unreal_pilot_guard.test.ps1"
      - "tools/pixel_streaming_local*.cjs"
      - "tools/audit_unreal_capture.py"
      - "unreal/**"
      - "docs/unreal-integration.md"
      - "docs/unreal-local-streaming.md"
      - "public/animations/bjj/standing_stance.glb"
      - "public/animations/bjj/rear_naked_choke.glb"
      - "public/animations/bjj/armbar.glb"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "unreal-pilot-${{ github.ref }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  offline-validation:
    name: Protocol and source preservation (no Unreal rendering)
    runs-on: ubuntu-latest
    # Dense source/candidate scalp and contact audits exceed the former budget.
    # Keep their complete coverage; this cap is unrelated to runtime readiness.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # These tests use only standard libraries and an injected fake transport.
      # No SDK, GPU runtime, network service or deployment is started.
      - name: Verify adapter and source staging
        run: node --test tests/unrealBridge.test.js tests/unrealLocalTransport.test.js tests/unrealLocalSession.test.js tools/prepare_unreal_pilot.test.mjs tools/pixel_streaming_local.test.cjs

      - name: Verify native control bridge offline
        run: |
          npm run test:unreal-native
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic -I unreal/native-runtime/Source/JiuQuestRuntime unreal/native-runtime/Tests/control-wire-tests.cpp -o "$RUNNER_TEMP/jiuquest-control-wire-tests"
          "$RUNNER_TEMP/jiuquest-control-wire-tests"

      - name: Verify local receiver contract without Unreal
        run: python -m unittest discover -s unreal/JiuQuestCharacters/Tests -p 'test_local_*.py'

      - name: Verify frozen pants normal material graph without Unreal
        run: python unreal/JiuQuestCharacters/Tests/test_pants_material.py

      - name: Verify reviewed jacket normal material graph without Unreal
        run: python unreal/JiuQuestCharacters/Tests/test_jacket_material.py

      - name: Verify standing gi body and opening preservation
        run: python unreal/JiuQuestCharacters/Tests/test_pilot_gi_body.py

      - name: Verify original source preservation
        run: python unreal/JiuQuestCharacters/Tests/test_pilot_source.py

      - name: Verify capture callback lifecycle without Unreal
        run: python unreal/JiuQuestCharacters/Tests/test_capture_lifecycle.py

      - name: Verify preview recipe guard without starting Unreal
        shell: pwsh
        run: ./tools/unreal_pilot_guard.test.ps1

      - name: Verify isolated character sculpt and grip preservation
        run: |
          python unreal/JiuQuestCharacters/Tests/test_pilot_look.py
          python unreal/JiuQuestCharacters/Tests/test_pilot_hair.py
          python unreal/JiuQuestCharacters/Tests/test_pilot_hair_shape.py
          python unreal/JiuQuestCharacters/Tests/test_ready_hands.py

      - name: Check Editor script syntax without importing Unreal
        run: python -m compileall -q unreal/JiuQuestCharacters/Content/Python tools/audit_unreal_capture.py

      - name: Record validation boundary
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          This workflow checks the offline message contract, native control gateway and portable wire framing, staged source integrity, hair-selection preservation, bounded character sculpt and standing grip preservation, capture callback lifecycle and Python syntax.

          It does not install or run Unreal Editor, import assets into Unreal, compile shaders, render characters, validate paired playback or establish Pixel Streaming. Those remain separate runtime checks. This workflow cannot deploy the application.
          EOF
